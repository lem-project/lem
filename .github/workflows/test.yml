name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]
  workflow_dispatch:

env:
  IMAGE_NAME: yeditor
  IMAGE_TAGS: latest ${{ github.sha }}

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Lint - Check for internal symbol usage
        run: |
          if [ $(grep -r --include="*.lisp" 'lem::' | wc -l) -ne 0 ]; then
            echo 'using `lem::` internal symbols'
            echo 'https://google.github.io/styleguide/lispguide.xml?showone=Packages#Packages'
            exit 1
          fi

      - name: IP compliance - headers and L0 boundary
        run: bash scripts/check-license-headers.sh

      - name: Build test image
        run: docker build -f docker/Dockerfile.test -t lem-tests .

      - name: IP compliance - dependency licenses
        run: docker run --rm --entrypoint bash lem-tests -c "sbcl --script scripts/check-dependency-licenses.lisp"

      - name: Run tests
        run: docker run --rm lem-tests

  push_image:
    name: Push Image to GHCR
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v3

      # GHCR requires a lowercase registry path; the repository owner may
      # contain uppercase ("Yuri-Albuquerque"). Compute it in a shell step.
      - name: Compute lowercase image registry
        run: echo "IMAGE_REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      # Build image using Buildah action
      - name: Build Image
        uses: redhat-actions/buildah-build@v2
        id: build_image
        with:
          containerfiles: ./Dockerfile
          image: ${{ env.IMAGE_NAME }}
          oci: true

      # Push the image to GHCR (Image Registry)
      - name: Push To GHCR
        uses: redhat-actions/push-to-registry@v2
        id: push
        with:
          image: ${{ steps.build_image.outputs.image }}
          tags: ${{ steps.build_image.outputs.tags }}
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
          extra-args: --disable-content-trust
